name: Verify dashboard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test src/fitness-model.test.mjs src/movement-library.test.mjs src/workout-timer.test.mjs src/timer-audio.test.mjs src/workout-session.test.mjs supabase/functions/assistant/*.test.mjs
      - run: npm run build
      - run: npm audit --audit-level=high
